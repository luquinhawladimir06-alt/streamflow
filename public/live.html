<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ao Vivo — StreamFlow</title>
  <meta name="description" content="Assista a uma transmissão ao vivo no StreamFlow." />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { overflow: hidden; }

    /* ── Tela de carregamento ── */
    #loading-screen {
      position: fixed; inset: 0;
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
    }
    #loading-screen p { color: var(--text-secondary); font-size: 0.95rem; }

    /* ── Tela offline ── */
    #offline-screen {
      position: fixed; inset: 0;
      background: var(--bg-base);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 24px;
      z-index: 200;
    }

    .offline-orb {
      position: absolute;
      width: 400px; height: 400px;
      background: rgba(124, 58, 237, 0.05);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    .offline-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 460px;
    }

    .offline-icon-ring {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }

    #offline-screen h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
    #offline-screen p { color: var(--text-secondary); font-size: 1rem; line-height: 1.7; }

    /* ── Vídeo do espectador ── */
    #viewer-screen {
      position: fixed; inset: 0;
      background: #000;
      display: none;
    }

    #remote-video {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* ── HUD (sobreposto ao vídeo) ── */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(10,10,15,0.85) 0%, transparent 100%);
      z-index: 10;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #hud.hidden { opacity: 0; pointer-events: none; }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-logo {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-primary);
      text-decoration: none;
      display: flex; align-items: center; gap: 7px;
    }
    .hud-logo svg { color: var(--purple-500); }
    .hud-logo .logo-accent { color: var(--purple-400); }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-count-hud {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-full);
      padding: 5px 14px;
    }
    .viewer-count-hud svg { color: var(--purple-400); }
    .viewer-count-hud strong { color: #fff; }

    /* ── Buffer / buffer indicator ── */
    #buffer-indicator {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- ── Tela de carregamento ─────────────────────────── -->
  <div id="loading-screen">
    <a href="/" class="nav-logo" style="margin-bottom:8px; text-decoration:none; display:flex; align-items:center; gap:10px; font-size:1.2rem; font-weight:800; color:var(--text-primary);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--purple-500);">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      Stream<span style="color:var(--purple-400);">Flow</span>
    </a>
    <div class="spinner"></div>
    <p id="loading-text">Conectando à transmissão...</p>
  </div>

  <!-- ── Tela offline ──────────────────────────────────── -->
  <div id="offline-screen">
    <div class="offline-orb"></div>
    <div class="offline-content">
      <div class="offline-icon-ring">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1 id="offline-title">Esta transmissão foi encerrada</h1>
      <p id="offline-message">O transmissor encerrou a transmissão. O link não está mais ativo.</p>
      <a href="/" class="btn btn-primary" id="back-home-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Voltar para o início
      </a>
    </div>
  </div>

  <!-- ── Tela do espectador (vídeo ao vivo) ────────────── -->
  <div id="viewer-screen">
    <!-- HUD sobreposto ao vídeo -->
    <div id="hud">
      <div class="hud-left">
        <a href="/" class="hud-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          Stream<span class="logo-accent">Flow</span>
        </a>
        <span class="badge badge-live">
          <span class="pulse-dot"></span>
          AO VIVO
        </span>
      </div>
      <div class="hud-right">
        <!-- Admin Button (Hidden by default, shown via auth.js) -->
        <a href="/admin.html" class="btn admin-panel-btn" style="display: none; align-items: center; gap: 6px; background: rgba(255, 193, 7, 0.1); color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.3); margin-right: 15px; padding: 4px 10px; font-size: 0.8rem;">
          👑 Painel
        </a>

        <!-- Profile Display (Hidden by default) -->
        <div class="user-profile-display" style="display: none; align-items: center; gap: 10px; margin-right: 15px;">
          <img src="" alt="Avatar" class="auth-user-avatar" style="width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--purple-500);" />
          <span class="auth-user-name" style="color: var(--text-primary); font-weight: 600; font-size: 0.85rem;"></span>
          <a href="/auth/logout" style="color: var(--text-muted); font-size: 0.8rem; text-decoration: none; margin-left: 8px;">Sair</a>
        </div>

        <!-- Login Button (Shown by default) -->
        <a href="/auth/discord" class="btn btn-secondary btn-sm discord-login-btn" style="margin-right: 15px; display: flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 0.8rem;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
          </svg>
          Discord
        </a>

        <!-- Botão de Mudo -->
        <button id="mute-btn" style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); color: white; padding: 6px 12px; border-radius: var(--radius-full); cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); transition: background 0.2s; margin-right: 12px;">
          <svg id="icon-unmuted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="icon-muted" style="display:none; color: var(--error-color);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <div class="viewer-count-hud" id="viewer-count-hud">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <strong id="viewer-count-num">—</strong>
          <span>espectador(es)</span>
        </div>
      </div>
    </div>

    <!-- Buffer indicator -->
    <div id="buffer-indicator">
      <div class="spinner"></div>
      <span>Bufferizando...</span>
    </div>

    <video id="remote-video" autoplay playsinline></video>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/viewer.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
