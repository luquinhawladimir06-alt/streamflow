<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Dono — StreamFlow</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .admin-page { padding: 104px 24px 40px; max-width: 1200px; margin: 0 auto; min-height: calc(100vh - 64px); }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
    .admin-title { font-size: 2rem; display: flex; align-items: center; gap: 12px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-bottom: 40px; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl); padding: 32px;
      display: flex; flex-direction: column; gap: 12px;
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--purple-500), #ffc107);
    }
    .stat-label { font-size: 1rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 3rem; font-weight: 800; color: var(--text-primary); }

    .streams-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
    .streams-table th, .streams-table td { padding: 16px 24px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
    .streams-table th { background: var(--bg-elevated); color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    .streams-table tr:last-child td { border-bottom: none; }
    
    .status-badge { background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(34, 197, 94, 0.2); }
    
    #error-screen { display: none; text-align: center; margin-top: 100px; }
    #error-screen h1 { color: #ff4757; font-size: 2.5rem; margin-bottom: 16px; }
  </style>
</head>
<body class="grid-bg">
  <nav class="navbar">
    <a href="/" class="nav-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      Paradise<span class="logo-accent">Flow</span>
    </a>
    <div class="nav-actions">
      <a href="/" class="btn btn-secondary btn-sm">Voltar ao site</a>
    </div>
  </nav>

  <div id="error-screen">
    <h1>Acesso Negado 🛑</h1>
    <p style="color: var(--text-secondary); font-size: 1.1rem;">Apenas o dono do servidor pode acessar esta página.</p>
  </div>

  <div id="admin-content" class="admin-page" style="display: none;">
    <div class="admin-header">
      <h1 class="admin-title">👑 Painel do Dono</h1>
      <span style="color: var(--text-muted); font-size: 0.9rem;">Atualizando em tempo real...</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total no Site</span>
        <span class="stat-value" id="total-connections">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Transmissões Ativas</span>
        <span class="stat-value" id="total-streams">0</span>
      </div>
    </div>

    <h2 style="font-size: 1.2rem; margin-bottom: 16px; color: var(--text-secondary);">Transmissões Rodando Agora</h2>
    <table class="streams-table">
      <thead>
        <tr>
          <th>ID da Live</th>
          <th>Espectadores</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="streams-tbody">
        <!-- Rows inseridas via JS -->
      </tbody>
    </table>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
